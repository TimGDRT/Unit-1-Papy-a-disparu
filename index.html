<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Papy a disparu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: pastel mall fills the screen; only text sits on small frosted panels.
   Menu: three level cards (1–3 stars). Game on iPad landscape: text + buttons in a left column,
   picture grid filling the rest (level 3 adds an "intrus" column). Portrait / phone: stacked.
   Single light look on purpose, to match the pastel background picture. */
:root {
  color-scheme: light;
  --wall: #EEF4FB;
  --panel: rgba(255, 255, 255, 0.86);
  --ink: #23355A;
  --muted: #53637F;
  --line: rgba(255, 255, 255, 0.95);
  --card: rgba(255, 255, 255, 0.55);
  --accent: #FFB677;
  --accent-ink: #4A2400;
  --star: #F5A623;
  --star-off: rgba(35, 53, 90, 0.18);
  --blue: #3C78D8;
  --good: #23905A;
  --good-bg: rgba(225, 244, 232, 0.94);
  --bad: #CC4A42;
  --bad-bg: rgba(252, 230, 227, 0.94);
  --intrus: #B86A9E;
  --font-display: "Playpen Sans", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--wall);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
.mall { position: fixed; inset: 0; z-index: -1; background: var(--wall) url("mall.jpg") center / cover no-repeat; }

.panel {
  background: var(--panel);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 6px 24px rgba(60, 100, 160, 0.12);
  padding: 16px 18px;
  display: grid;
  gap: 12px;
  align-content: start;
}
.eyebrow { font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 3.4vw, 2.2rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.stars { letter-spacing: .06em; white-space: nowrap; }
.stars .on { color: var(--star); }
.stars .off { color: var(--star-off); }

/* ---------- Menu ---------- */
.menu { min-height: 100%; display: grid; place-items: center; }
.menu-panel { max-width: 860px; width: 100%; padding: clamp(20px, 4vw, 36px); gap: 20px; }
.menu-head { display: grid; gap: 4px; }
.menu-head h1 { font-size: clamp(2rem, 5vw, 3rem); }
.menu-head p { margin: 0; color: var(--muted); }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.level {
  font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  background: #fff; border: 3px solid #DCE6F2; border-radius: 18px;
  padding: 18px; display: grid; gap: 6px; align-content: start;
  box-shadow: 0 4px 0 #DCE6F2;
  transition: transform .12s, border-color .12s, box-shadow .12s;
}
.level:hover { border-color: var(--accent); box-shadow: 0 4px 0 #D9894A; }
.level:active { transform: translateY(3px); box-shadow: 0 1px 0 #D9894A; }
.level .stars { font-size: 2rem; line-height: 1; }
.level strong { font-family: var(--font-display); font-size: 1.35rem; }
.level span.desc { color: var(--muted); font-size: .95rem; }
@media (max-width: 700px) { .levels { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Jeu ---------- */
.app {
  max-width: 1500px; margin: 0 auto;
  display: grid; gap: 16px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "intro" "board" "controls";
}
.side { display: contents; }
.intro { grid-area: intro; }
.controls { grid-area: controls; }
.topline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.back {
  font: 700 .95rem var(--font-body); color: var(--ink); background: #fff;
  border: 2px solid #D3DEEC; border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.chip { font-weight: 700; font-size: .95rem; display: flex; gap: 6px; align-items: center; }
.chip .stars { font-size: 1.15rem; }
.intro p { margin: 0; color: var(--muted); max-width: 68ch; }
.name { display: flex; align-items: end; gap: 8px; font-family: var(--font-display); }
.name input {
  font: inherit; color: var(--ink); background: transparent; border: 0;
  border-bottom: 2px dashed var(--muted); width: 100%; max-width: 14rem; min-width: 0; padding: 2px 4px;
}
.name input:focus { outline: none; border-bottom-color: var(--blue); border-bottom-style: solid; }

.board { grid-area: board; display: grid; gap: 14px; min-height: 0; }
.story { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; min-height: 0; }
.intrus {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
  border: 3px dashed var(--intrus); border-radius: 18px; padding: 12px;
  background: rgba(255, 255, 255, 0.35); min-height: 0;
}
.intrus-label {
  grid-column: 1 / -1;
  background: var(--panel); border-radius: 10px; padding: 6px 10px;
  font-family: var(--font-display); font-weight: 700; color: var(--intrus);
  text-align: center; line-height: 1.25;
}
.slot { min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 6px; }
.pic { min-width: 0; min-height: 0; }
.frame { position: relative; width: 100%; }
.hint {
  margin: 0; background: var(--panel); border-radius: 10px; padding: 6px 9px;
  font-size: .86rem; line-height: 1.3; color: var(--ink);
}
.num {
  position: absolute; top: -8px; left: -8px; z-index: 2;
  font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;
  width: 2.2rem; height: 2.2rem; border-radius: 50%;
  display: grid; place-items: center;
  background: #fff; border: 2px solid var(--ink); color: var(--ink);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12); pointer-events: none;
}
.card {
  position: relative; width: 100%; display: block;
  background: var(--card); border: 3px solid var(--line); border-radius: 14px; padding: 4px;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  box-shadow: 0 4px 14px rgba(60, 100, 160, 0.14);
  transition: transform .15s, border-color .15s, box-shadow .15s;
}
.card img {
  width: 100%; max-width: 100%; aspect-ratio: 4 / 3; object-fit: contain;
  border-radius: 10px; display: block; pointer-events: none; -webkit-user-drag: none;
}
.card:hover { border-color: #fff; box-shadow: 0 6px 18px rgba(60, 100, 160, 0.22); }
.card.is-selected { border-color: var(--blue); transform: translateY(-5px); box-shadow: 0 10px 22px rgba(60, 120, 216, 0.35); }
.card.is-lifted { opacity: .35; }
.slot.drop-hover .card { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(60, 120, 216, 0.35); }
.card.is-correct { border-color: var(--good); background: var(--good-bg); }
.card.is-wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake .45s; }
.card.is-solved { cursor: default; }
.card.pop { animation: pop .25s; }
.mark {
  position: absolute; top: -10px; right: -10px;
  width: 2.1rem; height: 2.1rem; border-radius: 50%;
  display: grid; place-items: center;
  color: #fff; font-size: 1.15rem; font-weight: 700; font-style: normal; pointer-events: none;
}
.is-correct .mark { background: var(--good); }
.is-wrong .mark { background: var(--bad); }
.zoom {
  position: absolute; right: 10px; bottom: 10px;
  width: 2.3rem; height: 2.3rem; border-radius: 50%;
  border: 0; background: rgba(255, 255, 255, 0.94); color: var(--ink);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  display: grid; place-items: center; cursor: zoom-in;
}
.zoom svg { width: 1.15rem; height: 1.15rem; }
.ghost {
  position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none;
  box-shadow: 0 16px 30px rgba(0, 0, 0, .25); border-color: var(--blue) !important;
}

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { font: 700 1.12rem var(--font-display); border-radius: 14px; padding: 13px 24px; cursor: pointer; border: 2px solid transparent; flex: 1 1 auto; }
.btn-check { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 #D9894A; }
.btn-check:active { transform: translateY(3px); box-shadow: 0 1px 0 #D9894A; }
.btn-check:disabled { opacity: .5; cursor: default; }
.btn-shuffle { background: #fff; color: var(--ink); border-color: #D3DEEC; }
.btn:focus-visible, .card:focus-visible, .zoom:focus-visible, .lb-close:focus-visible, .level:focus-visible, .back:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

.feedback { border-radius: 12px; padding: 12px 14px; font-family: var(--font-display); font-size: 1.1rem; font-weight: 500; line-height: 1.35; }
.feedback:empty { display: none; }
.feedback.good { background: var(--good-bg); color: var(--good); }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }

/* iPad quer und größere Bildschirme: alles auf einen Blick */
@media (min-width: 900px) and (orientation: landscape) {
  html, body { height: 100%; }
  body { padding-block: 14px; }
  .app {
    height: 100%;
    grid-template-columns: minmax(250px, 300px) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "intro board" "controls board";
  }
  .controls { align-self: start; }
  .actions { flex-direction: column; }
  .board { height: 100%; }
  .board.has-intrus { grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); }
  .story { grid-template-rows: repeat(3, minmax(0, 1fr)); height: 100%; }
  .intrus { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto repeat(3, minmax(0, 1fr)); height: 100%; }
  .slot { height: 100%; }
  .pic { container-type: size; display: grid; place-items: center; }
  .frame { width: min(100cqw, calc((100cqh - 14px) * 4 / 3)); }
}

.lightbox {
  position: fixed; inset: 0; z-index: 70; background: rgba(25, 38, 66, 0.78);
  display: grid; place-items: center;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 14px; background: #fff; }
.lb-close {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
  font: 700 1rem var(--font-body); background: #fff; color: var(--ink);
  border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
}
.confetti { position: fixed; top: -12px; width: 10px; height: 14px; z-index: 60; pointer-events: none; border-radius: 2px; animation: fall 1.8s ease-in forwards; }

@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes pop { 0% { transform: scale(.92); } 100% { transform: scale(1); } }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) { .card, .card.is-wrong, .card.pop, .level { animation: none; transition: none; } }
@media (max-width: 620px) {
  .story { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .zoom { width: 2.1rem; height: 2.1rem; }
}
</style>
</head>
<body>
<div class="mall" aria-hidden="true"></div>

<section class="menu" id="menu">
  <div class="panel menu-panel">
    <div class="menu-head">
      <p class="eyebrow">Unité 1 · Exercice 2</p>
      <h1>Papy a disparu</h1>
      <p>Écoute l’histoire et remets les images dans le bon ordre. Choisis ton niveau&nbsp;:</p>
    </div>
    <div class="levels">
      <button class="level" type="button" data-level="1">
        <span class="stars" aria-hidden="true"><span class="on">★</span></span>
        <strong>Un peu plus facile</strong>
        <span class="desc">Des petites phrases t’aident à trouver le bon ordre.</span>
      </button>
      <button class="level" type="button" data-level="2">
        <span class="stars" aria-hidden="true"><span class="on">★★</span></span>
        <strong>Comme dans le livre</strong>
        <span class="desc">Tu ranges les 9 images tout seul.</span>
      </button>
      <button class="level" type="button" data-level="3">
        <span class="stars" aria-hidden="true"><span class="on">★★★</span></span>
        <strong>Pour ceux qui veulent un challenge</strong>
        <span class="desc">Attention&nbsp;: 3 images ne font pas partie de l’histoire&nbsp;!</span>
      </button>
    </div>
  </div>
</section>

<main class="app" id="app" hidden>
  <div class="side">
    <section class="panel intro">
      <div class="topline">
        <button class="back" id="back" type="button">← Menu</button>
        <span class="chip" id="chip"></span>
      </div>
      <div>
        <p class="eyebrow">Unité 1 · Exercice 2</p>
        <h1>Papy a disparu</h1>
      </div>
      <label class="name" for="kid-name">Prénom&nbsp;: <input id="kid-name" type="text" autocomplete="off"></label>
      <p id="instructions"></p>
    </section>

    <section class="panel controls">
      <div class="actions">
        <button class="btn btn-check" id="check" type="button">Vérifier</button>
        <button class="btn btn-shuffle" id="shuffle" type="button">Mélanger</button>
      </div>
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    </section>
  </div>

  <div class="board" id="board" aria-label="Images"></div>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lb-close" type="button">Fermer</button>
  <img id="lb-img" alt="">
</div>

<script>
document.documentElement.lang = "fr";

/* Google-Tabelle : colle ici le lien de l'application Web (il se termine par /exec).
   Laisse vide ("") pour ne rien enregistrer. */
const SHEET_URL = "";

/* Le bon ordre est l'ordre de cette liste.
   1 hall (grande image) · 2 hall (la dame) · 3 restaurant · 4 librairie · 5 coiffeur
   6 vêtements · 7 jardinage · 8 accueil · 9 banc */
const STORY = ["b9.jpg", "b8.jpg", "b7.jpg", "b5.jpg", "b6.jpg", "b3.jpg", "b4.jpg", "b2.jpg", "b1.jpg"];
/* Images qui ne font pas partie de l'histoire (niveau 3) */
const EXTRA = ["x1.jpg", "x2.jpg", "x3.jpg"];
/* Aides du niveau 1 : une phrase par place */
const HINTS = [
  "Toute la famille est au centre commercial. Mais où est Papy&nbsp;?",
  "Maman et Lucas demandent à une dame si elle a vu Papy.",
  "Papa retourne au restaurant. Le serveur a vu un monsieur avec une barbe.",
  "Mathieu et Liette vont à la librairie. Papy vient de partir.",
  "Chez le coiffeur, les enfants montrent une photo de Papy.",
  "Au magasin de vêtements, le vendeur a vu Papy avec son veston bleu.",
  "Au rayon jardinage, Lucas trouve un monsieur qui dort. Ce n’est pas Papy&nbsp;!",
  "Maman demande à l’accueil d’appeler Papy. Liette arrive en courant.",
  "Papy est sur le banc. Il montre une photo à un monsieur.",
];
const LEVELS = {
  1: { name: "Un peu plus facile", text: "<strong>Écoute et retrouve les scènes.</strong> Les petites phrases sous les places t’aident. Fais glisser une image sur une autre pour les échanger, ou touche deux images l’une après l’autre. Avec la loupe, tu vois l’image en grand." },
  2: { name: "Comme dans le livre", text: "<strong>Écoute et retrouve les scènes.</strong> Mets les images dans le bon ordre&nbsp;: fais glisser une image sur une autre pour les échanger, ou touche deux images l’une après l’autre. Avec la loupe, tu vois l’image en grand." },
  3: { name: "Challenge", text: "<strong>Écoute et retrouve les scènes.</strong> Attention&nbsp;: 3 images ne font pas partie de l’histoire. Mets-les dans la case «&nbsp;Pas dans l’histoire&nbsp;» et range les autres dans le bon ordre." },
};

const menu = document.getElementById("menu");
const app = document.getElementById("app");
const board = document.getElementById("board");
const feedback = document.getElementById("feedback");
const checkBtn = document.getElementById("check");
const lightbox = document.getElementById("lightbox");
const lbImg = document.getElementById("lb-img");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const ZOOM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21 M10.5 7.5 V13.5 M7.5 10.5 H13.5"/></svg>';

let attempts = 0, level = 2, items = [], order = [], selected = null, solved = false, drag = null, suppressClick = false;

const starsHTML = n => `<span class="stars" aria-hidden="true"><span class="on">${"★".repeat(n)}</span></span>`;
const isRight = (pos, idx) => pos < STORY.length ? idx === pos : idx >= STORY.length;
const countRight = a => a.reduce((s, idx, pos) => s + (isRight(pos, idx) ? 1 : 0), 0);

function shuffled(n) {
  let a;
  do {
    a = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  } while (countRight(a) > 1);
  return a;
}

function showMenu() {
  app.hidden = true;
  menu.hidden = false;
  closeZoom();
}

function startLevel(l) {
  level = LEVELS[l] ? +l : 2;
  items = level === 3 ? STORY.concat(EXTRA) : STORY.slice();
  document.getElementById("chip").innerHTML = starsHTML(level) + LEVELS[level].name;
  document.getElementById("instructions").innerHTML = LEVELS[level].text;
  menu.hidden = true;
  app.hidden = false;
  newRound();
}

function newRound() {
  order = shuffled(items.length);
  attempts = 0;
  selected = null;
  solved = false;
  checkBtn.disabled = false;
  setFeedback("", "");
  render();
}

function slotHTML(pos, popped) {
  const inStory = pos < STORY.length;
  const label = inStory ? `Image à la place ${pos + 1}` : "Image dans la case « pas dans l’histoire »";
  return `<div class="slot" data-pos="${pos}">
    <div class="pic"><div class="frame">
      ${inStory ? `<div class="num" aria-hidden="true">${pos + 1}</div>` : ""}
      <button class="card${popped.includes(pos) ? " pop" : ""}${solved ? " is-correct is-solved" : ""}" type="button" data-pos="${pos}" aria-label="${label}">
        <img src="${items[order[pos]]}" alt="" draggable="false">${solved ? '<i class="mark" aria-hidden="true">✓</i>' : ""}
      </button>
      <button class="zoom" type="button" data-pos="${pos}" aria-label="Voir en grand&nbsp;: ${label}">${ZOOM_ICON}</button>
    </div></div>
    ${level === 1 && inStory ? `<p class="hint">${HINTS[pos]}</p>` : ""}
  </div>`;
}

function render(popped = []) {
  let html = '<div class="story">';
  for (let p = 0; p < STORY.length; p++) html += slotHTML(p, popped);
  html += "</div>";
  if (level === 3) {
    html += '<div class="intrus"><div class="intrus-label">Pas dans l’histoire</div>';
    for (let p = STORY.length; p < items.length; p++) html += slotHTML(p, popped);
    html += "</div>";
  }
  board.className = "board" + (level === 3 ? " has-intrus" : "");
  board.innerHTML = html;
}

function swap(a, b) {
  if (a === b) return;
  [order[a], order[b]] = [order[b], order[a]];
  selected = null;
  setFeedback("", "");
  render([a, b]);
}

function setFeedback(text, kind) {
  feedback.textContent = text;
  feedback.className = "feedback" + (kind ? " " + kind : "");
}

function clearMarks() {
  board.querySelectorAll(".card").forEach(c => c.classList.remove("is-correct", "is-wrong"));
  board.querySelectorAll(".mark").forEach(m => m.remove());
}

const nameInput = document.getElementById("kid-name");
try { nameInput.value = localStorage.getItem("prenom") || ""; } catch (_) {}
nameInput.addEventListener("input", () => { try { localStorage.setItem("prenom", nameInput.value); } catch (_) {} });

function logResult(right, n) {
  if (!SHEET_URL) return;
  const data = new URLSearchParams({ prenom: nameInput.value.trim(), niveau: String(level), essai: String(attempts), bonnes: `${right}/${n}`, reussi: right === n ? "oui" : "non" });
  try { fetch(SHEET_URL, { method: "POST", mode: "no-cors", body: data }).catch(() => {}); } catch (_) {}
}

function check() {
  if (solved) return;
  if (SHEET_URL && !nameInput.value.trim()) {
    setFeedback("Écris d’abord ton prénom en haut, puis clique sur « Vérifier ».", "bad");
    nameInput.focus();
    return;
  }
  attempts++;
  selected = null;
  const n = order.length;
  let right = 0;
  board.querySelectorAll(".card").forEach(card => {
    const pos = +card.dataset.pos;
    const ok = isRight(pos, order[pos]);
    if (ok) right++;
    card.classList.remove("is-selected", "is-correct", "is-wrong");
    void card.offsetWidth;
    card.classList.add(ok ? "is-correct" : "is-wrong");
    card.querySelector(".mark")?.remove();
    card.insertAdjacentHTML("beforeend", `<i class="mark" aria-hidden="true">${ok ? "✓" : "✗"}</i>`);
  });
  logResult(right, n);
  if (right === n) {
    solved = true;
    checkBtn.disabled = true;
    board.querySelectorAll(".card").forEach(c => c.classList.add("is-solved"));
    setFeedback(level === 3 ? "⭐ Bravo ! Tu as trouvé les intrus et toutes les images sont dans le bon ordre." : "⭐ Bravo ! Toutes les images sont dans le bon ordre.", "good");
    celebrate();
  } else {
    const msg = right === 0 ? "Aucune image n’est encore bien placée." : right === 1 ? `1 image sur ${n} est déjà bien placée.` : `${right} images sur ${n} sont déjà bien placées.`;
    setFeedback(`${msg} Échange les images rouges et essaie encore !`, "bad");
  }
}

function celebrate() {
  if (reduceMotion) return;
  const colors = ["#FFB677", "#8DB8F2", "#9ED9B4", "#F6A6C1", "#FFE08A"];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = Math.random() * 0.5 + "s";
    c.style.animationDuration = 1.4 + Math.random() * 0.9 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

/* Loupe */
function openZoom(pos) {
  lbImg.src = items[order[pos]];
  lbImg.alt = "Image en grand";
  lightbox.hidden = false;
  document.getElementById("lb-close").focus();
}
function closeZoom() { lightbox.hidden = true; }
document.getElementById("lb-close").addEventListener("click", closeZoom);
lightbox.addEventListener("click", e => { if (e.target === lightbox) closeZoom(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !lightbox.hidden) closeZoom(); });

/* Toucher */
board.addEventListener("click", e => {
  const zoom = e.target.closest(".zoom");
  if (zoom) { openZoom(+zoom.dataset.pos); return; }
  const card = e.target.closest(".card");
  if (!card || solved) return;
  if (suppressClick) { suppressClick = false; return; }
  const pos = +card.dataset.pos;
  if (selected === null) {
    selected = pos;
    clearMarks();
    card.classList.add("is-selected");
  } else if (selected === pos) {
    selected = null;
    card.classList.remove("is-selected");
  } else {
    swap(selected, pos);
  }
});

/* Glisser */
board.addEventListener("pointerdown", e => {
  const card = e.target.closest(".card");
  if (!card || solved || e.button > 0) return;
  drag = { card, pos: +card.dataset.pos, x: e.clientX, y: e.clientY, moved: false, ghost: null, target: null };
  try { card.setPointerCapture(e.pointerId); } catch (_) {}
});

board.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
    drag.moved = true;
    const r = drag.card.getBoundingClientRect();
    drag.offX = drag.x - r.left; drag.offY = drag.y - r.top;
    const g = drag.card.cloneNode(true);
    g.classList.remove("is-selected", "is-correct", "is-wrong", "pop");
    g.querySelector(".mark")?.remove();
    g.classList.add("ghost");
    g.style.width = r.width + "px";
    g.style.height = r.height + "px";
    g.style.margin = "0";
    document.body.appendChild(g);
    drag.ghost = g;
    drag.card.classList.add("is-lifted");
    if (selected !== null) { board.querySelector(".is-selected")?.classList.remove("is-selected"); selected = null; }
  }
  if (drag.moved) {
    drag.ghost.style.transform = `translate(${e.clientX - drag.offX}px, ${e.clientY - drag.offY}px) rotate(-3deg) scale(1.05)`;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const slot = under && under.closest(".slot");
    if (drag.target && drag.target !== slot) drag.target.classList.remove("drop-hover");
    drag.target = slot && +slot.dataset.pos !== drag.pos ? slot : null;
    if (drag.target) drag.target.classList.add("drop-hover");
  }
});

function endDrag(commit) {
  if (!drag) return;
  if (drag.moved) {
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
    drag.ghost.remove();
    drag.card.classList.remove("is-lifted");
    const target = drag.target;
    if (target) target.classList.remove("drop-hover");
    if (commit && target) swap(drag.pos, +target.dataset.pos);
  }
  drag = null;
}
board.addEventListener("pointerup", () => endDrag(true));
board.addEventListener("pointercancel", () => endDrag(false));

/* Menu */
document.querySelectorAll(".level").forEach(b => b.addEventListener("click", () => startLevel(b.dataset.level)));
document.getElementById("back").addEventListener("click", showMenu);
checkBtn.addEventListener("click", check);
document.getElementById("shuffle").addEventListener("click", newRound);

const fromHash = { facile: 1, moyen: 2, difficile: 3 }[(location.hash || "").slice(1)];
if (fromHash) startLevel(fromHash); else showMenu();
</script>
</body>
</html>
